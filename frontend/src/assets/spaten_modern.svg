<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CC0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B0000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="spadeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#5a0000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="98" fill="url(#bgGrad)"/>
  <circle cx="100" cy="100" r="98" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.25"/>

  <!-- === SPADE ICON === -->
  <!-- Spade head: stylized from the original spaten.svg shape -->
  <g filter="url(#shadow)" fill="url(#spadeGrad)">
    <!-- Blade (wide trapezoid at top, narrowing down) -->
    <path d="
      M 100 32
      C 78 32, 58 44, 55 60
      C 52 74, 60 84, 72 88
      L 68 105
      L 132 105
      L 128 88
      C 140 84, 148 74, 145 60
      C 142 44, 122 32, 100 32
      Z
    "/>
    <!-- Center rib on blade -->
    <rect x="98" y="50" width="4" height="40" rx="2" fill="#CC0000" opacity="0.3"/>
    <!-- Handle neck -->
    <rect x="93" y="103" width="14" height="38" rx="7"/>
    <!-- Handle grip (T-bar bottom) -->
    <rect x="72" y="138" width="56" height="13" rx="6.5"/>
    <!-- Handle grip center knob -->
    <rect x="95" y="149" width="10" height="14" rx="5"/>
  </g>

  <!-- === HOUSE OUTLINE (subtle) around the spade === -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.35" stroke-linejoin="round">
    <!-- Roof -->
    <polyline points="62,82 100,50 138,82"/>
    <!-- Left wall down -->
    <line x1="66" y1="82" x2="66" y2="108"/>
    <!-- Right wall down -->
    <line x1="134" y1="82" x2="134" y2="108"/>
  </g>

  <!-- === TEXT "HomeWatcher" === -->
  <text
    x="100"
    y="176"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-weight="800"
    font-size="14"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="1.5"
  >HOME WATCHER</text>

  <!-- Thin bottom accent line -->
  <line x1="55" y1="182" x2="145" y2="182" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>
</svg>
