<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 268 268" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CC0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B0000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="spadeBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E8E8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#5a0000" flood-opacity="0.45"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="134" cy="134" r="130" fill="url(#bgGrad)"/>
  <!-- Outer ring -->
  <circle cx="134" cy="134" r="130" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.2"/>
  <!-- Inner ring -->
  <circle cx="134" cy="134" r="122" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12"/>

  <!-- ===================== -->
  <!-- SPADE (Spaten) shape  -->
  <!-- Based on original SVG geometry, redrawn cleanly -->
  <!-- ===================== -->
  <g filter="url(#shadow)">

    <!-- === BLADE (Spatenblatt) === -->
    <!-- Wide trapezoidal blade top -->
    <path d="
      M 134 32
      C 104 32, 76 46, 70 68
      C 64 88, 76 104, 92 110
      L 88 140
      L 180 140
      L 176 110
      C 192 104, 204 88, 198 68
      C 192 46, 164 32, 134 32
      Z
    " fill="url(#spadeBodyGrad)" stroke="#CC0000" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- Center rib on blade (subtle red highlight) -->
    <rect x="131" y="50" width="6" height="72" rx="3" fill="#CC0000" opacity="0.18"/>

    <!-- Blade edge highlight (left) -->
    <path d="M 75 72 C 72 85, 77 99, 90 108" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>

    <!-- === NECK (Stiel oben) === -->
    <rect x="122" y="138" width="24" height="52" rx="12" fill="url(#spadeBodyGrad)"/>

    <!-- === CROSSGUARD (Querholm) === -->
    <rect x="90" y="184" width="88" height="20" rx="10" fill="url(#spadeBodyGrad)"/>

    <!-- === LOWER HANDLE === -->
    <rect x="126" y="202" width="16" height="30" rx="8" fill="url(#spadeBodyGrad)"/>

    <!-- === END CAP === -->
    <ellipse cx="134" cy="234" rx="18" ry="10" fill="url(#spadeBodyGrad)"/>

  </g>

  <!-- ===================== -->
  <!-- Subtle house silhouette outline around the spade -->
  <!-- ===================== -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.22" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="72,108 134,58 196,108"/>
    <line x1="77" y1="108" x2="77" y2="142"/>
    <line x1="191" y1="108" x2="191" y2="142"/>
  </g>

  <!-- ===================== -->
  <!-- Text label            -->
  <!-- ===================== -->
  <text
    x="134"
    y="255"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="800"
    font-size="16"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="2"
    opacity="0.9"
  >HOMEWATCHER</text>

</svg>
