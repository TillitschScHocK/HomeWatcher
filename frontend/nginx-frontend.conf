# Serves the Vite build output on port 3000.
# Port 80 is reserved for the reverse-proxy nginx container.
server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
