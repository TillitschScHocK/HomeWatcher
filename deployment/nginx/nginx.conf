# Reverse-proxy nginx – runs on port 80 inside the shared VPN namespace.
#
# All containers (frontend, backend, nginx) share network_mode: service:vpn
# and therefore share localhost (127.0.0.1). No DNS resolution needed.
#
# This file is mounted as /etc/nginx/nginx.conf (the top-level config).
# It does NOT include /etc/nginx/conf.d/*.conf so the default server block
# that nginx:alpine ships with is completely ignored, avoiding a duplicate
# listen 80 conflict with the frontend container.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    map $http_x_forwarded_proto $x_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $http_x_forwarded_port $x_forwarded_port {
        default $http_x_forwarded_port;
        "" $server_port;
    }

    server {
        listen 80;

        # ── Frontend (static files, port 3000) ──────────────────────
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── Backend REST API ────────────────────────────────────────
        location /api/ {
            proxy_pass http://127.0.0.1:5000;

            proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
            proxy_set_header X-Forwarded-Port $x_forwarded_port;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            add_header 'Access-Control-Allow-Origin' '*';
        }

        # ── WebSocket ───────────────────────────────────────────────
        location /socket.io/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        # ── HLS proxy ───────────────────────────────────────────────
        location /proxy/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;

            proxy_hide_header Content-Type;
            add_header Content-Type 'application/vnd.apple.mpegurl' always;
            add_header Cache-Control no-cache;
            add_header Pragma no-cache;
        }

        # ── Stream files (tmpfs volume) ──────────────────────────────
        location /streams/ {
            root /;
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Range';
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range';
            add_header Cache-Control no-cache;
            add_header Pragma no-cache;
        }
    }
}
