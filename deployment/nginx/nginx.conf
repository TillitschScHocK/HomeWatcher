worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # All containers share the VPN network namespace (network_mode: service:vpn).
    # Docker's embedded DNS resolves container names within the same namespace.
    # Use 127.0.0.11 (Docker's internal resolver) so nginx re-resolves
    # upstream hostnames at runtime instead of only at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    #Forward header if there is a proxy in front otherwise set the headers
    map $http_x_forwarded_proto $x_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $http_x_forwarded_port $x_forwarded_port {
        default $http_x_forwarded_port;
        "" $server_port;
    }

    server {
        listen 80;

        location / {
            set $frontend http://127.0.0.1:80;
            proxy_pass $frontend;
        }

        location /api/ {
            set $backend http://127.0.0.1:5000;
            proxy_pass $backend;

            proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
            proxy_set_header X-Forwarded-Port $x_forwarded_port;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            add_header 'Access-Control-Allow-Origin' '*';
        }

        location /socket.io/ {
            set $backend http://127.0.0.1:5000;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /proxy/ {
            set $backend http://127.0.0.1:5000;
            proxy_pass $backend;
            proxy_set_header Host $host;

            proxy_hide_header Content-Type;
            add_header Content-Type 'application/vnd.apple.mpegurl' always;

            add_header Cache-Control no-cache;
            add_header Pragma no-cache;
        }

        location /streams/ {
            root /;

            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Range';
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range';

            add_header Cache-Control no-cache;
            add_header Pragma no-cache;
        }
    }
}
