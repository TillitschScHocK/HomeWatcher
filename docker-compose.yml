services:

  # ─────────────────────────────────────────────
  # VPN – Base network container (CyberGhost / OpenVPN)
  #
  # Owns the published port ${UI_PORT}:80. Backend, frontend, and nginx
  # all share this network namespace via network_mode: service:vpn, so
  # all outbound traffic from those containers exits through the tunnel.
  #
  # Port layout inside the shared namespace:
  #   :80   reverse-proxy nginx (this is what the browser hits)
  #   :3000 frontend nginx (static files)
  #   :5000 backend Node.js
  # ─────────────────────────────────────────────
  vpn:
    image: ghcr.io/wfg/openvpn-client:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - ./vpn/openvpn.ovpn:/data/vpn/vpn.conf:ro
      - ./vpn/ca.crt:/data/vpn/ca.crt:ro
      - ./vpn/client.crt:/data/vpn/client.crt:ro
      - ./vpn/client.key:/data/vpn/client.key:ro
      - ./vpn/credentials.txt:/data/vpn/credentials.txt:ro
    environment:
      - SUBNETS=${LAN_SUBNET:-192.168.0.0/16}
      - KILL_SWITCH=off
    ports:
      - "${UI_PORT:-1966}:80"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    healthcheck:
      # TUN interfaces always report state UNKNOWN on Linux, never UP.
      test: ["CMD", "sh", "-c", "ip link show tun0 2>/dev/null | grep -q tun0"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 45s

  # ─────────────────────────────────────────────
  # Frontend – Vite/React build served by nginx on port 3000
  # (port 80 is taken by the reverse-proxy nginx container)
  # ─────────────────────────────────────────────
  iptv_restream_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_STREAM_DELAY: ${VITE_STREAM_DELAY:-18}
        VITE_STREAM_PROXY_DELAY: ${VITE_STREAM_PROXY_DELAY:-30}
        #VITE_BACKEND_URL: http://123.123.123.123:5000
        #VITE_SYNCHRONIZATION_TOLERANCE: 0.8
        #VITE_SYNCHRONIZATION_MAX_DEVIATION: 4
        #VITE_SYNCHRONIZATION_ADJUSTMENT: 0.06
        #VITE_SYNCHRONIZATION_MAX_ADJUSTMENT: 0.16
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # Backend – Routed through VPN tunnel
  # ─────────────────────────────────────────────
  iptv_restream_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    volumes:
      - streams_data:/streams
      - channels:/channels
    environment:
      STORAGE_PATH: /streams/
      #BACKEND_URL: http://localhost:5000

  # ─────────────────────────────────────────────
  # Nginx – Reverse proxy on port 80, routed through VPN.
  # Port is published via the vpn container above.
  # ─────────────────────────────────────────────
  iptv_restream_nginx:
    image: nginx:alpine
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
      iptv_restream_frontend:
        condition: service_started
      iptv_restream_backend:
        condition: service_started
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf
      - streams_data:/streams

  # ─────────────────────────────────────────────
  # VPN IP Check – one-shot helper (profile: tools)
  # Run:  docker compose run --rm vpn-check
  # ─────────────────────────────────────────────
  vpn-check:
    image: alpine:latest
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    # Use a shell script file instead of inline command to avoid
    # Docker Compose interpolating $VARIABLE as Compose variables.
    volumes:
      - ./vpn/check.sh:/check.sh:ro
    entrypoint: ["/bin/sh", "/check.sh"]
    restart: "no"
    profiles:
      - tools

  # ─────────────────────────────────────────────
  # Watchtower – Automatic container image updates
  # Runs on the bridge network (needs Docker socket, not VPN).
  # ─────────────────────────────────────────────
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=${WATCHTOWER_CLEANUP:-true}
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
    networks:
      - app-network

volumes:
  streams_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  channels:

networks:
  app-network:
    driver: bridge
