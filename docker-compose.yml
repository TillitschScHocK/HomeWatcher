services:

  # ─────────────────────────────────────────────
  # VPN – Base network container (CyberGhost / OpenVPN)
  #
  # All containers that need to talk to each other (nginx, frontend,
  # backend) share this network namespace via network_mode: service:vpn.
  # This is required so nginx can resolve hostnames like
  # "iptv_restream_frontend" – Docker's embedded DNS only works within
  # a shared network namespace.
  #
  # KILL_SWITCH=off: the wfg image uses iptables for its kill switch,
  # which requires the host kernel to expose iptables modules to the
  # container. Disable if your host does not support this.
  # ─────────────────────────────────────────────
  vpn:
    image: ghcr.io/wfg/openvpn-client:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - ./vpn/openvpn.ovpn:/data/vpn/vpn.conf:ro
      - ./vpn/ca.crt:/data/vpn/ca.crt:ro
      - ./vpn/client.crt:/data/vpn/client.crt:ro
      - ./vpn/client.key:/data/vpn/client.key:ro
      - ./vpn/credentials.txt:/data/vpn/credentials.txt:ro
    environment:
      - SUBNETS=${LAN_SUBNET:-192.168.0.0/16}
      - KILL_SWITCH=off
    ports:
      - "${UI_PORT:-1966}:80"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    healthcheck:
      # TUN interfaces always report state UNKNOWN on Linux, never UP.
      # We simply check that the tun0 interface exists.
      test: ["CMD", "sh", "-c", "ip link show tun0 2>/dev/null | grep -q tun0"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 45s

  # ─────────────────────────────────────────────
  # Frontend – Static UI (nginx:alpine serving /dist)
  #
  # Shares the VPN network namespace so that iptv_restream_nginx
  # can proxy_pass to "iptv_restream_frontend" by hostname.
  # Docker's embedded DNS resolves container names only within the
  # same network namespace; since nginx runs in service:vpn, all
  # upstream containers must do the same.
  # ─────────────────────────────────────────────
  iptv_restream_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_STREAM_DELAY: ${VITE_STREAM_DELAY:-18}
        VITE_STREAM_PROXY_DELAY: ${VITE_STREAM_PROXY_DELAY:-30}
        #VITE_BACKEND_URL: http://123.123.123.123:5000
        #VITE_SYNCHRONIZATION_TOLERANCE: 0.8
        #VITE_SYNCHRONIZATION_MAX_DEVIATION: 4
        #VITE_SYNCHRONIZATION_ADJUSTMENT: 0.06
        #VITE_SYNCHRONIZATION_MAX_ADJUSTMENT: 0.16
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # Backend – Routed through VPN tunnel
  # ─────────────────────────────────────────────
  iptv_restream_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    volumes:
      - streams_data:/streams
      - channels:/channels
    environment:
      STORAGE_PATH: /streams/
      #BACKEND_URL: http://localhost:5000

  # ─────────────────────────────────────────────
  # Nginx – Reverse proxy, routed through VPN.
  # Port is published via the vpn container above.
  # ─────────────────────────────────────────────
  iptv_restream_nginx:
    image: nginx:alpine
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
      iptv_restream_frontend:
        condition: service_started
      iptv_restream_backend:
        condition: service_started
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf
      - streams_data:/streams

  # ─────────────────────────────────────────────
  # VPN IP Check – one-shot helper (profile: tools)
  # Run:  docker compose run --rm vpn-check
  # Shows your real IP vs. the VPN exit IP in color.
  # ─────────────────────────────────────────────
  vpn-check:
    image: alpine:latest
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl 2>/dev/null 1>/dev/null
        GREEN='\033[0;32m'
        RED='\033[0;31m'
        YELLOW='\033[1;33m'
        RESET='\033[0m'
        BOLD='\033[1m'

        echo ""
        echo "${BOLD}=== VPN IP Check ===${RESET}"

        # Fetch real host IP via --interface eth0 (bypasses tun0 route)
        REAL_IP=$(curl -s --interface eth0 --max-time 5 https://api.ipify.org 2>/dev/null)
        if [ -z "$REAL_IP" ]; then
          REAL_IP="${YELLOW}could not determine${RESET}"
        fi

        # Fetch VPN exit IP via tun0
        VPN_IP=$(curl -s --interface tun0 --max-time 5 https://api.ipify.org 2>/dev/null)
        if [ -z "$VPN_IP" ]; then
          VPN_IP="${YELLOW}could not determine${RESET}"
        fi

        echo "  Host IP  : ${BOLD}${REAL_IP}${RESET}"
        echo "  VPN IP   : ${BOLD}${VPN_IP}${RESET}"
        echo ""

        if [ "$REAL_IP" = "$VPN_IP" ] || [ -z "$VPN_IP" ]; then
          echo "  ${RED}FAIL – VPN does not appear to be routing traffic!${RESET}"
        elif echo "$REAL_IP" | grep -qE '^[0-9]+'; then
          if [ "$REAL_IP" != "$VPN_IP" ]; then
            echo "  ${GREEN}OK – VPN is active. Traffic exits via a different IP.${RESET}"
          fi
        else
          echo "  ${YELLOW}UNKNOWN – Could not compare IPs reliably.${RESET}"
        fi
        echo ""
    restart: "no"
    profiles:
      - tools

  # ─────────────────────────────────────────────
  # Watchtower – Automatic container image updates
  # ─────────────────────────────────────────────
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=${WATCHTOWER_CLEANUP:-true}
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy

volumes:
  streams_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  channels:
