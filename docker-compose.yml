services:

  # ─────────────────────────────────────────────
  # VPN – Base network container (CyberGhost / OpenVPN)
  #
  # Uses ghcr.io/wfg/openvpn-client (OpenVPN 2.6+).
  #
  # KILL_SWITCH=off:
  #   The wfg image tries to set up iptables rules as a kill switch.
  #   This requires the host kernel to expose iptables modules to the
  #   container. Set to "on" if your host supports it.
  #
  # Healthcheck note:
  #   TUN interfaces report state UNKNOWN (not UP) – this is normal
  #   kernel behavior for point-to-point virtual interfaces. The check
  #   therefore tests for the existence of tun0 via ping instead.
  # ─────────────────────────────────────────────
  vpn:
    image: ghcr.io/wfg/openvpn-client:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - ./vpn/openvpn.ovpn:/data/vpn/vpn.conf:ro
      - ./vpn/ca.crt:/data/vpn/ca.crt:ro
      - ./vpn/client.crt:/data/vpn/client.crt:ro
      - ./vpn/client.key:/data/vpn/client.key:ro
      - ./vpn/credentials.txt:/data/vpn/credentials.txt:ro
    environment:
      - SUBNETS=${LAN_SUBNET:-192.168.0.0/16}
      - KILL_SWITCH=off
    ports:
      - "${UI_PORT:-1966}:80"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    healthcheck:
      # tun0 on Linux TUN interfaces always shows state UNKNOWN, never UP.
      # We verify connectivity by pinging the VPN gateway assigned by the
      # server (first address in the pushed subnet, e.g. 10.27.4.1).
      # Fallback: if the gateway ping fails, check that tun0 simply exists.
      test: ["CMD", "sh", "-c", "ip link show tun0 2>/dev/null | grep -q tun0"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 45s

  # ─────────────────────────────────────────────
  # VPN IP Check – one-shot container to verify the
  # backend actually exits through the VPN tunnel.
  # Run manually:  docker compose run --rm vpn-check
  # ─────────────────────────────────────────────
  vpn-check:
    image: alpine:latest
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    command: ["sh", "-c", "apk add --no-cache curl -q && echo '--- VPN IP Check ---' && curl -s https://api.ipify.org && echo '' && curl -s https://ipapi.co/json/ | grep -E '\"ip\"|\"country_name\"|\"org\"' && echo '--- Done ---'"]
    restart: "no"
    profiles:
      - tools

  # ─────────────────────────────────────────────
  # Frontend – Static UI files only, no VPN needed
  # ─────────────────────────────────────────────
  iptv_restream_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_STREAM_DELAY: ${VITE_STREAM_DELAY:-18}
        VITE_STREAM_PROXY_DELAY: ${VITE_STREAM_PROXY_DELAY:-30}
        #VITE_BACKEND_URL: http://123.123.123.123:5000
        #VITE_SYNCHRONIZATION_TOLERANCE: 0.8
        #VITE_SYNCHRONIZATION_MAX_DEVIATION: 4
        #VITE_SYNCHRONIZATION_ADJUSTMENT: 0.06
        #VITE_SYNCHRONIZATION_MAX_ADJUSTMENT: 0.16
    restart: unless-stopped
    networks:
      - app-network

  # ─────────────────────────────────────────────
  # Backend – Routed through VPN tunnel
  # ─────────────────────────────────────────────
  iptv_restream_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    volumes:
      - streams_data:/streams
      - channels:/channels
    environment:
      STORAGE_PATH: /streams/
      #BACKEND_URL: http://localhost:5000

  # ─────────────────────────────────────────────
  # Nginx – Reverse proxy, also routed through VPN.
  # Port is published via the vpn container above.
  # ─────────────────────────────────────────────
  iptv_restream_nginx:
    image: nginx:alpine
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
      iptv_restream_frontend:
        condition: service_started
      iptv_restream_backend:
        condition: service_started
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf
      - streams_data:/streams

  # ─────────────────────────────────────────────
  # Watchtower – Automatic container image updates
  # ─────────────────────────────────────────────
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=${WATCHTOWER_CLEANUP:-true}
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
    networks:
      - app-network

volumes:
  streams_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  channels:

networks:
  app-network:
    driver: bridge
