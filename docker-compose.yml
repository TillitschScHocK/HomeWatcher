services:

  # ─────────────────────────────────────────────────────────────────
  # VPN – Base network container (CyberGhost / OpenVPN)
  #
  # Owns the published port ${UI_PORT}:80.
  # All other app containers share this network namespace via
  # network_mode: service:vpn so their traffic exits the VPN tunnel.
  #
  # Port layout inside the shared namespace:
  #   :80   reverse-proxy nginx  ← browser connects here
  #   :3000 frontend nginx       (static files)
  #   :5000 backend Node.js
  # ─────────────────────────────────────────────────────────────────
  vpn:
    image: ghcr.io/wfg/openvpn-client:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - ./vpn/openvpn.ovpn:/data/vpn/vpn.conf:ro
      - ./vpn/ca.crt:/data/vpn/ca.crt:ro
      - ./vpn/client.crt:/data/vpn/client.crt:ro
      - ./vpn/client.key:/data/vpn/client.key:ro
      - ./vpn/credentials.txt:/data/vpn/credentials.txt:ro
    environment:
      - SUBNETS=${LAN_SUBNET:-192.168.0.0/16}
      - KILL_SWITCH=off
    ports:
      - "${UI_PORT:-1966}:80"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    healthcheck:
      test: ["CMD", "sh", "-c", "ip link show tun0 2>/dev/null | grep -q tun0"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 45s

  # ─────────────────────────────────────────────────────────────────
  # Frontend – Vite/React build served by nginx on port 3000
  # ─────────────────────────────────────────────────────────────────
  iptv_restream_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_STREAM_DELAY: ${VITE_STREAM_DELAY:-18}
        VITE_STREAM_PROXY_DELAY: ${VITE_STREAM_PROXY_DELAY:-30}
        #VITE_BACKEND_URL: http://123.123.123.123:5000
        #VITE_SYNCHRONIZATION_TOLERANCE: 0.8
        #VITE_SYNCHRONIZATION_MAX_DEVIATION: 4
        #VITE_SYNCHRONIZATION_ADJUSTMENT: 0.06
        #VITE_SYNCHRONIZATION_MAX_ADJUSTMENT: 0.16
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────
  # Backend – Routed through VPN tunnel
  # ─────────────────────────────────────────────────────────────────
  iptv_restream_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    volumes:
      - streams_data:/streams
      - channels:/channels
    environment:
      STORAGE_PATH: /streams/
      #BACKEND_URL: http://localhost:5000

  # ─────────────────────────────────────────────────────────────────
  # Nginx – Reverse proxy on port 80, built from custom Dockerfile
  # that removes default.conf to prevent duplicate listen 80 conflict.
  # ─────────────────────────────────────────────────────────────────
  iptv_restream_nginx:
    build:
      context: ./deployment/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
      iptv_restream_frontend:
        condition: service_started
      iptv_restream_backend:
        condition: service_started
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - streams_data:/streams

  # ─────────────────────────────────────────────────────────────────
  # VPN IP Check – one-shot helper (profile: tools)
  # Run:  docker compose --profile tools run --rm vpn-check
  # ─────────────────────────────────────────────────────────────────
  vpn-check:
    image: alpine:latest
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    volumes:
      - ./vpn/check.sh:/check.sh:ro
    entrypoint: ["/bin/sh", "/check.sh"]
    restart: "no"
    profiles:
      - tools

volumes:
  streams_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  channels:
