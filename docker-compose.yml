services:

  # ─────────────────────────────────────────────────────────────────
  # VPN – Base network container (CyberGhost / OpenVPN)
  #
  # Problem: Docker's port-mapping (ports: 1966:80) only works for
  # the container that declares `ports:`. nginx runs in the shared
  # network namespace (network_mode: service:vpn) and listens on :80
  # there, but the VPN container itself has nothing on :80, so Docker
  # refuses incoming connections.
  #
  # Fix: vpn/entrypoint.sh installs socat and runs it as a background
  # forwarder: VPN-container :8080 -> 127.0.0.1:80 (nginx in the
  # shared namespace). We publish 1966:8080 instead of 1966:80.
  # ─────────────────────────────────────────────────────────────────
  vpn:
    image: ghcr.io/wfg/openvpn-client:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - ./vpn/openvpn.ovpn:/data/vpn/vpn.conf:ro
      - ./vpn/ca.crt:/data/vpn/ca.crt:ro
      - ./vpn/client.crt:/data/vpn/client.crt:ro
      - ./vpn/client.key:/data/vpn/client.key:ro
      - ./vpn/credentials.txt:/data/vpn/credentials.txt:ro
      - ./vpn/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - SUBNETS=${LAN_SUBNET:-192.168.0.0/16}
      - KILL_SWITCH=off
    ports:
      - "${UI_PORT:-1966}:8080"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    healthcheck:
      test: ["CMD", "sh", "-c", "ip link show tun0 2>/dev/null | grep -q tun0"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 45s

  # ─────────────────────────────────────────────────────────────────
  # Backend – Node.js on port 5000, routed through VPN
  # ─────────────────────────────────────────────────────────────────
  iptv_restream_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    volumes:
      - streams_data:/streams
      - channels:/channels
    environment:
      STORAGE_PATH: /streams/

  # ─────────────────────────────────────────────────────────────────
  # Nginx – single container serving static files + API proxy
  # Listens on port 80 inside the shared VPN namespace.
  # Reachable from outside via socat forwarder in the VPN container.
  # ─────────────────────────────────────────────────────────────────
  iptv_restream_nginx:
    build:
      context: .
      dockerfile: deployment/nginx/Dockerfile
      args:
        VITE_STREAM_DELAY: ${VITE_STREAM_DELAY:-18}
        VITE_STREAM_PROXY_DELAY: ${VITE_STREAM_PROXY_DELAY:-30}
        #VITE_BACKEND_URL: http://123.123.123.123:5000
        #VITE_SYNCHRONIZATION_TOLERANCE: 0.8
        #VITE_SYNCHRONIZATION_MAX_DEVIATION: 4
        #VITE_SYNCHRONIZATION_ADJUSTMENT: 0.06
        #VITE_SYNCHRONIZATION_MAX_ADJUSTMENT: 0.16
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
      iptv_restream_backend:
        condition: service_started
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - streams_data:/streams

  # ─────────────────────────────────────────────────────────────────
  # VPN IP Check – one-shot helper (profile: tools)
  # Run:  docker compose --profile tools run --rm vpn-check
  # ─────────────────────────────────────────────────────────────────
  vpn-check:
    image: alpine:latest
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    volumes:
      - ./vpn/check.sh:/check.sh:ro
    entrypoint: ["/bin/sh", "/check.sh"]
    restart: "no"
    profiles:
      - tools

volumes:
  streams_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  channels:
